<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoreGrow Career Partners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* VOICE: confident, warm, expert; one advisor speaking to one professional
   IDEA: a personal advisory "brief" in deep blue glass, matching the reference layout
   PICTURE: the expert's profile card with a before/after resume line beside it
   COLOUR and TYPE: deep blue ground, glass panels, warm orange accent; Inter Tight display + Inter body
   LAYOUT: sticky nav, hero, goals, numbered sections, service cards, employers, approach, expert, results, FAQ, CTA, footer */
:root{color-scheme:dark;--bg:#081733;--bg2:#0c2149;--glass:rgba(22,52,104,.55);--line:rgba(140,175,235,.22);--ink:#eef3ff;--soft:#b7c4e0;--mute:#8d9cbd;--acc:#f2994a;--acc2:#ffb877}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:clip}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 600px at 80% -10%,rgba(46,98,196,.55),transparent 60%),radial-gradient(700px 500px at -10% 40%,rgba(30,70,150,.45),transparent 60%),linear-gradient(180deg,#0a1c3f,#081733 60%,#071430);}
body::after{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(140,175,235,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(140,175,235,.05) 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(180deg,#000,transparent 70%)}
a{color:inherit}
[hidden]{display:none!important}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;margin:0;letter-spacing:-.03em;line-height:1.02;text-wrap:balance}
h1{font-size:clamp(44px,7vw,92px);font-weight:700}
h2{font-size:clamp(34px,5vw,64px);font-weight:700}
h3{font-size:22px;font-weight:600;letter-spacing:-.01em}
em{font-style:normal;color:var(--acc)}
p{margin:0 0 12px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
.band{padding:clamp(56px,8vw,110px) 0;border-top:1px solid var(--line)}
.eyebrow{display:flex;gap:10px;align-items:center;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:22px}
.eyebrow b{color:var(--acc);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:12px 22px;border-radius:999px;font:600 15px Inter,sans-serif;text-decoration:none;border:1px solid var(--acc);background:var(--acc);color:#1a1206;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:hover{filter:brightness(1.08)}
.arrow{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--acc);color:var(--acc);font-size:16px;flex:none}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--acc2);outline-offset:3px}
/* nav */
nav{position:sticky;top:0;z-index:20;background:rgba(8,23,51,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:24px;min-height:72px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;margin-right:auto}
.mark{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#2f6fe4,#1748a8);display:grid;place-items:center;font:800 18px "Inter Tight",Inter,system-ui,sans-serif;color:#fff;position:relative}
.mark::after{content:"";position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:3px;background:var(--acc)}
.logo b{display:block;font:700 20px/1 "Inter Tight",Inter,system-ui,sans-serif;letter-spacing:.06em}
.logo small{display:block;font-size:10.5px;letter-spacing:.28em;color:var(--soft);margin-top:4px}
.links{display:flex;gap:22px;flex-wrap:wrap;font-size:15px}
.links a{text-decoration:none;color:var(--soft)}.links a:hover{color:var(--ink)}
.talk{display:flex;align-items:center;gap:12px;text-decoration:none;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
/* hero */
.hero{padding:clamp(40px,6vw,80px) 0 clamp(56px,7vw,96px)}
.crumbs{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:22px}
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(110,160,255,.5);background:rgba(46,98,196,.25);border-radius:999px;padding:8px 16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#cfe0ff;margin-bottom:26px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.hgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:clamp(28px,4vw,56px);align-items:end}
.lead{font-size:clamp(17px,1.6vw,20px);color:var(--soft);max-width:58ch;margin-top:24px}
.cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(8px)}
.expert{padding:24px}
.who{display:flex;gap:16px;align-items:center}
.avatar{width:72px;height:72px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 26px "Inter Tight",Inter,system-ui,sans-serif;color:#1a1206;background:linear-gradient(135deg,var(--acc2),var(--acc))}
.who b{display:block;font:600 20px/1.2 "Inter Tight",Inter,system-ui,sans-serif}
.who span{font-size:14px;color:var(--soft)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.tags span{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--soft)}
.reframe{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:10px;font-size:14px}
.reframe small{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.reframe .after small{color:var(--acc)}
.reframe .before p{color:var(--mute);text-decoration:line-through;text-decoration-color:rgba(242,153,74,.6);margin:0}
.reframe .after p{margin:0}
/* goals + ticker */
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:46px}
.goal{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px;text-decoration:none}
.goal small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.goal b{font:600 18px "Inter Tight",Inter,system-ui,sans-serif}
.ticker{overflow:hidden;border-block:1px solid var(--line);padding:16px 0;white-space:nowrap}
.ticker div{display:inline-block;animation:run 40s linear infinite;font:600 clamp(20px,2.4vw,30px) "Inter Tight",Inter,system-ui,sans-serif;color:var(--soft)}
.ticker span{margin:0 26px}.ticker i{color:var(--acc);font-style:normal}
@keyframes run{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.ticker div{animation:none}html{scroll-behavior:auto}}
/* sections */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:clamp(28px,5vw,70px);align-items:end;margin-bottom:40px}
.split p{color:var(--soft);font-size:17px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 64px;margin-top:40px}
.strip div{display:flex;gap:14px;align-items:center;padding:20px;border:1px solid var(--line);margin-left:-1px;background:rgba(14,38,82,.6);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.strip div b{color:var(--acc);font-weight:500}
.strip div:last-child{justify-content:center;color:var(--acc);font-size:22px}
.svc{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.svc .card{padding:26px;display:flex;flex-direction:column;gap:10px;position:relative;grid-column:span 2;min-height:300px}
.svc .card.big{grid-column:span 3}
.svc .num{font:700 72px/1 "Inter Tight",Inter,system-ui,sans-serif;color:rgba(140,175,235,.12);margin:6px 0 auto}
.svc .lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.svc .card p{color:var(--soft);font-size:15px;margin:0}
.price{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.price b{font:700 17px Inter;color:var(--ink);letter-spacing:0;text-transform:none}
.go{display:inline-flex;gap:8px;align-items:center;font-size:13px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
.go i{color:var(--acc);font-style:normal}
.svc .corner{position:absolute;top:22px;right:22px;width:38px;height:38px}
.emp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,70px);align-items:center}
.emp ul{list-style:none;padding:0;margin:22px 0}
.emp li{display:flex;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.emp li span{color:var(--soft)}
.globe{aspect-ratio:1/.85;padding:20px;display:grid;place-items:center}
.globe svg{width:100%;height:100%}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.steps .card{padding:24px}
.steps .card b{display:block;font:700 48px/1 "Inter Tight",Inter,system-ui,sans-serif;color:var(--acc);margin-bottom:18px}
.steps p{color:var(--soft);font-size:15px;margin:8px 0 0}
.meet{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,4vw,56px)}
.meet .card{padding:28px}
.contact{display:grid;gap:10px;margin-top:18px;font-size:15px}
.contact div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.contact span{color:var(--mute)}
.wins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.wins .card{padding:24px}
.wins q{quotes:none;display:block;font:500 18px/1.5 "Inter Tight",Inter,system-ui,sans-serif;margin:10px 0 14px}
.wins small{color:var(--mute);font-size:13px}
.wins .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.faq{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:clamp(24px,4vw,56px)}
details{border-bottom:1px solid var(--line);padding:18px 0}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;font:600 18px "Inter Tight",Inter,system-ui,sans-serif}
summary::after{content:"+";color:var(--acc);font-size:24px;line-height:1}
details[open] summary::after{content:"–"}
details p{color:var(--soft);margin:10px 0 0}
.final{text-align:center}
.final .cta{justify-content:center}
footer{border-top:1px solid var(--line);padding:40px 0;color:var(--mute);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between}
footer b{color:var(--ink)}
.note{font-size:13px;color:var(--mute);margin-top:14px}
@media(max-width:980px){.links{display:none}.hgrid,.split,.emp,.meet,.faq{grid-template-columns:minmax(0,1fr)}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.svc .card,.svc .card.big{grid-column:span 3}.wins{grid-template-columns:minmax(0,1fr)}}
@media(max-width:640px){.goals,.steps{grid-template-columns:minmax(0,1fr)}.strip{grid-template-columns:minmax(0,1fr)}.strip div{margin-left:0;margin-top:-1px}.svc{grid-template-columns:minmax(0,1fr)}.svc .card,.svc .card.big{grid-column:auto;min-height:0}.talk span{display:none}}

.links a.on{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--soft);text-decoration:none}
.chip i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 10px Inter;color:#1a1206;background:linear-gradient(135deg,var(--acc2),var(--acc));font-style:normal}
.bc{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-bottom:26px}
.bc a{color:var(--soft);text-decoration:none}.bc a:hover{color:var(--ink)}
.page{padding:clamp(40px,6vw,80px) 0}
.dhead{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(28px,5vw,64px);align-items:start}
.paybox{padding:26px}
.paybox .big{font:700 clamp(40px,5vw,56px)/1 "Inter Tight",Inter,system-ui,sans-serif;margin:8px 0 6px}
.paybox .big small{font:500 16px Inter;color:var(--soft)}
.paybox .btn{width:100%;justify-content:center;margin-top:16px}
.methods{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.methods span{font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--soft);background:rgba(8,23,51,.5)}
.secure{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);margin-top:12px}
.list{list-style:none;padding:0;margin:18px 0 0}
.list li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);color:var(--soft)}
.list li::before{content:"✳";color:var(--acc)}
.aft{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:26px}
.aft .card{padding:22px}
.aft b{display:block;font:700 34px/1 "Inter Tight",Inter,system-ui,sans-serif;color:var(--acc);margin-bottom:12px}
.aft p{color:var(--soft);font-size:15px;margin:6px 0 0}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:16px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:500}
td.p{white-space:nowrap;font-weight:600}
.scroll{overflow-x:auto}
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.team a{padding:22px;text-decoration:none;display:flex;flex-direction:column;gap:14px}
.team .avatar{width:64px;height:64px;font-size:22px}
.team b{font:600 20px "Inter Tight",Inter,system-ui,sans-serif}
.team span{color:var(--soft);font-size:14px}
.form{display:grid;gap:16px;padding:26px}
.form label{display:grid;gap:8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.form input,.form select,.form textarea{font:16px Inter,sans-serif;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(8,23,51,.7);color:var(--ink);width:100%;min-height:48px}
.form textarea{min-height:120px;resize:vertical}
.form .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.msg{font-size:14px;color:var(--acc2);min-height:20px}
.note-body{max-width:72ch;font-size:17px;color:var(--soft)}
.note-body h3{color:var(--ink);margin:28px 0 10px}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.res a{padding:24px;text-decoration:none;display:flex;flex-direction:column;gap:10px}
.res a p{color:var(--soft);font-size:15px;margin:0}
.res .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.res .go{margin-top:auto}
.tiers{padding:22px 26px}
.tiers .th{display:flex;justify-content:space-between;gap:12px;font-size:13px;letter-spacing:.06em;color:var(--soft);padding-bottom:10px}
.tiers .th span:last-child{letter-spacing:.12em;text-transform:uppercase;font-size:12px}
.tiers a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:clamp(18px,2vw,21px)}
.tiers a:last-of-type{border-bottom:0}
.tiers a b{font-weight:700;white-space:nowrap}.tiers a i{font-style:normal;color:var(--acc);font-size:15px;margin-left:10px}
.tiers a:hover b{color:var(--acc2)}
@media(max-width:980px){.dhead{grid-template-columns:minmax(0,1fr)}.res,.aft{grid-template-columns:minmax(0,1fr)}}
@media(max-width:640px){.form .row{grid-template-columns:minmax(0,1fr)}}
</style>
</head>

const GLOBE = `<svg viewBox="0 0 400 340"><defs><radialGradient id="g" cx="50%" cy="45%"><stop offset="0" stop-color="#2f6fe4" stop-opacity=".55"/><stop offset="1" stop-color="#2f6fe4" stop-opacity="0"/></radialGradient></defs><circle cx="200" cy="170" r="150" fill="url(#g)"/><circle cx="200" cy="170" r="140" fill="none" stroke="#8cafeb" stroke-opacity=".35"/><ellipse cx="200" cy="170" rx="60" ry="140" fill="none" stroke="#8cafeb" stroke-opacity=".2"/><ellipse cx="200" cy="170" rx="110" ry="140" fill="none" stroke="#8cafeb" stroke-opacity=".2"/><line x1="60" y1="170" x2="340" y2="170" stroke="#8cafeb" stroke-opacity=".2"/><g fill="none" stroke="#f2994a" stroke-width="1.6" stroke-dasharray="3 5"><path d="M200 180 Q150 90 115 110"/><path d="M200 180 Q190 80 190 92"/><path d="M200 180 Q250 90 232 100"/><path d="M200 180 Q280 140 290 168"/><path d="M200 180 Q300 230 300 250"/><path d="M200 180 Q140 160 120 160"/></g><g fill="#f2994a"><circle cx="115" cy="110" r="5"/><circle cx="190" cy="92" r="5"/><circle cx="232" cy="100" r="5"/><circle cx="290" cy="168" r="5"/><circle cx="300" cy="250" r="5"/><circle cx="120" cy="160" r="5"/></g><circle cx="200" cy="180" r="8" fill="#fff"/><g fill="#eef3ff" font-family="Inter" font-size="12" font-weight="600"><text x="72" y="104">Canada</text><text x="176" y="82">UK</text><text x="240" y="96">Germany</text><text x="298" y="166">UAE</text><text x="268" y="270">Australia</text><text x="82" y="178">USA</text></g></svg>`;

function bindContact() {
  const f = $('cf'); if (!f) return;
  const build = () => {
    const sel = $('f-what').value;
    const to = sel === 'Hiring support (employer)' ? 'info@moregrowglobalsearch.com' : E().email;
    const su = `CAREER: ${sel}${ex !== 'main' ? ' (for ' + E().name + ')' : ''}`;
    const body = `Hi ${ex === 'main' ? 'MoreGrow team' : E().name.split(' ')[0]},\n\nName: ${$('f-name').value}\nEmail: ${$('f-email').value}\nInterested in: ${sel}\nCareer level: ${$('f-level').value}\n\n${$('f-msg').value}\n\nThanks,\n${$('f-name').value}`;
    return {to, su, body};
  };
  f.addEventListener('submit', e => {
    e.preventDefault();
    if (!f.reportValidity()) return;
    const m = build();
    const a = document.createElement('a'); a.href = gmail(m.to, m.su, m.body); a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
    $('f-out').textContent = `Your draft to ${m.to} is ready in Gmail. If it didn't open, use Copy message and email ${m.to}.`;
  });
  $('f-copy').addEventListener('click', async () => {
    const m = build();
    try { await navigator.clipboard.writeText(`To: ${m.to}\nSubject: ${m.su}\n\n${m.body}`); $('f-out').textContent = `Copied. Paste it into an email to ${m.to}.`; }
    catch (e) { $('f-out').textContent = `Copy was blocked. Please email ${m.to} directly.`; }
  });
}

const NAV = {services: 'services', pricing: 'pricing', employers: 'employers', approach: 'approach', team: 'team', resources: 'resources'};
function route() {
  let key = location.hash.slice(1) || 'home';
  if (EXPERTS[key]) { ex = key; try { sessionStorage.setItem('mg-expert', key); } catch (e) {} key = 'home'; }
  const view = V[key] || V.home;
  app.innerHTML = view();
  bindContact();
  $('xchip').innerHTML = ex === 'main' ? '' : `<a class="chip" href="#contact"><i>${ini(E().name)}</i>${E().name}</a>`;
  const top = key.startsWith('svc-') ? 'services' : key.startsWith('note-') ? 'resources' : key;
  document.querySelectorAll('.links a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + top));
  const s = SERVICES.find(x => x.key === key);
  document.title = (s ? s.name + ' · ' : key !== 'home' && V[key] ? key[0].toUpperCase() + key.slice(1) + ' · ' : '') + (ex === 'main' ? 'MoreGrow Career Partners' : E().name + ' · MoreGrow Career Partners');
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
}
